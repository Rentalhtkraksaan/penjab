<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anjay — Password Salah</title>
  <style>
    :root{
      --text:#ffffff;
      --glass: rgba(255,255,255,0.1);
      --border: rgba(255,255,255,0.25);
      --accent:#60a5fa;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{height:100%; margin:0; padding:0;}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 20% 20%, rgba(96,165,250,.25), transparent 60%),
        radial-gradient(900px 700px at 80% 80%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(160deg, #0b1220, #0f172a 60%, #111827);
      display:flex;
      align-items:center;      /* center atas bawah */
      justify-content:center;  /* center kanan kiri */
      -webkit-user-select:none; user-select:none;
      padding:24px;
    }
    .card{
      width:min(560px, 92vw);
      padding:24px 22px;
      border-radius:18px;
      background:var(--glass);
      border:1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 12px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
      text-align:center;
    }
    .title{
      margin:0 0 8px;
      font-size:1.6rem; font-weight:800; letter-spacing:.3px;
      animation: pop .45s ease;
    }
    .msg{
      margin:0 auto 16px; line-height:1.55; font-size:1.05rem; opacity:.95;
      max-width:40ch;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:12px 16px; border-radius:12px; border:0; cursor:pointer;
      color:#0b1220; font-weight:700;
      background:#fff; transition:transform .06s ease, box-shadow .2s ease;
      box-shadow: 0 8px 18px rgba(255,255,255,.08);
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform:translateY(1px)}
    .hint{margin-top:10px; font-size:.85rem; opacity:.8}
    @keyframes pop{from{transform:scale(.98); opacity:0} to{transform:scale(1); opacity:1}}
  </style>
</head>
<body>
  <main class="card" role="alert" aria-live="assertive">
    <h1 class="title">Anjay!</h1>
    <p class="msg"><strong>SALAH??!!</strong> Wah, spektakuler — kamu sukses tekan tombol SALAH berkali-kali. Coba pakai otak, bukan nebak-nebak random. 😏</p>

    <a class="btn" href="index.html" title="Kembali ke halaman login">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Coba Lagi ke Login
    </a>

    <div class="hint">Lupa password? Tenang — hubungi Developer kalau mau selamat dari kehancuran jarimu.</div>
  </main>
</body>
</html>
