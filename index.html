<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    :root{
      --bg-blur: 6px;
      --card-bg: rgba(255,255,255,0.12);
      --card-border: rgba(255,255,255,0.25);
      --text: #ffffff;
      --accent: #60a5fa;
      --accent-2: #22d3ee;
    }

    /* === HILANGKAN HIGHLIGHT BIRU/ABU di WebKit (iOS/Android Chrome) === */
    * { -webkit-tap-highlight-color: rgba(0,0,0,0); }
    a, button, .btn, input, textarea, select, label, video {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    input, textarea, select, button {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 12px;
    }
    html { -webkit-text-size-adjust: 100%; }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
      color:var(--text); overflow:hidden;
    }
    /* Background image */
    .bg{
      position:fixed; inset:0; z-index:-2; overflow:hidden;
    }
    .bg img{
      position:absolute; min-width:100%; min-height:100%;
      width:auto; height:auto; top:50%; left:50%; transform:translate(-50%,-50%);
      object-fit:cover; filter:brightness(0.6);
    }
    /* Gradient overlay */
    .overlay{
      position:fixed; inset:0; z-index:-1;
      background: radial-gradient(1200px 800px at 80% 20%, rgba(34,211,238,0.25), transparent 60%),
                  radial-gradient(800px 600px at 20% 80%, rgba(96,165,250,0.25), transparent 60%),
                  linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.55));
      backdrop-filter: blur(var(--bg-blur));
    }
    /* Center card */
    .wrap{
      min-height:100svh; display:grid; place-items:center; padding:24px;
    }
    .card{
      width:100%; max-width:420px; padding:28px 24px 22px;
      border:1px solid var(--card-border); border-radius:18px;
      background:var(--card-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }
    h1{
      margin:0 0 6px; font-size:1.4rem; letter-spacing:.2px; font-weight:700;
    }
    p.sub{
      margin:0 0 18px; opacity:.85; font-size:.95rem;
    }
    .field{margin:14px 0;}
    label{display:block; margin:0 0 6px; font-size:.9rem; opacity:.9}
    .input{
      width:100%; padding:14px 14px; border-radius:12px; font-size:1rem; color:#0b1220;
      border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.9);
      outline:none; transition:border .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .input[readonly]{
      color:#0b1220; opacity:.9; background:rgba(255,255,255,0.75); cursor:not-allowed;
    }
    .input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(96,165,250,.25)}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:14px 16px; margin-top:10px; border:0; border-radius:12px;
      background:linear-gradient(90deg, var(--accent), var(--accent-2));
      color:white; font-weight:700; letter-spacing:.2px; cursor:pointer;
      transition: transform .06s ease, filter .2s ease;
    }
    .btn:active{transform:translateY(1px)}
    .row{display:flex; gap:10px; align-items:center}
    .hint{margin-top:12px; font-size:.85rem; opacity:.85}
    .err{display:none; margin-top:12px; font-size:.9rem; color:#fecaca; background:rgba(239,68,68,.18);
         border:1px solid rgba(239,68,68,.4); padding:10px 12px; border-radius:10px;}
    .err.show{display:block}
    .stamp{
      margin-bottom:10px; display:inline-block; padding:6px 10px; border-radius:999px; 
      font-size:.75rem; letter-spacing:.3px; text-transform:uppercase;
      border:1px dashed rgba(255,255,255,.45); background:rgba(255,255,255,.08);
    }
    .footer{
      margin-top:14px; font-size:.8rem; opacity:.75; text-align:center;
    }
  </style>
</head>
<body>
  <!-- Background image -->
  <div class="bg" aria-hidden="true">
    <img src="bg.jpg" alt="Background"/>
  </div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="wrap">
    <form class="card" id="loginForm" autocomplete="off">
      <span class="stamp">Portal PJ</span>
      <h1>Masuk</h1>
      <p class="sub">Silakan verifikasi password untuk melanjutkan.</p>

      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" type="text"
               value="PENJAB INBIS" readonly />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password"
               placeholder="Masukkan password" required />
      </div>

      <button class="btn" type="submit" id="submitBtn" title="Masuk">
        Masuk
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M13 5l7 7-7 7M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="errorBox" class="err">Password salah. Mengarahkan ke halaman alternatif…</div>
      <div class="footer">Username sudah terkunci oleh sistem.</div>
    </form>
  </div>

  <script>
    // === ATUR PASSWORD BENAR DI SINI ===
    const CORRECT_PW = "nurizcantik";

    const form = document.getElementById('loginForm');
    const pw = document.getElementById('password');
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBox.classList.remove('show');

      const inputPw = (pw.value || "").trim();
      btn.disabled = true;

      if (inputPw === CORRECT_PW) {
        window.location.href = "Penjab.html";
      } else {
        errorBox.classList.add('show');
        setTimeout(() => {
          window.location.href = "anjay.html";
        }, 700);
      }
    });
  </script>
</body>
</html>
