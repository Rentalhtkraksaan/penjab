    .back-link {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,0.05);

        .back-link:hover {
            transform: scale(1.08);
            background: rgba(0,123,255,0.06);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;

        }
        .date-picker, .filter-group, .form-status-control {
            display: flex;
            align-items: center;

        input[type="date"], select, button {

        #currentTanggal {

        .loading-text {

        table {

        /* Gaya untuk checkbox dan aksi massal */

        <div class="controls">

            <button id="deleteSelectedBtn" class="delete-selected-btn">Hapus Data Terpilih</button>

        <table id="dataTable" style="display:none;">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>Nama Lengkap</th>
                    <th>Nama Produk</th>

                    <th>Total per Baris</th>

        <div id="totalOverall" class="total-box"></div>
        
        <div id="soldItemsForm" class="sold-items-form" style="display:none;">
            <h2>Barang Terjual</h2>
            <div id="soldItemsList"></div>
            <div class="profit-container">
                <ul id="individualSellerProfit" class="individual-profit-list"></ul>
                <div id="totalSellerProfit" class="seller-profit"></div>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDpPEkKbEt6b_v2OWlBfGuaVQpBg2-RWR4",
        authDomain: "cwu-gen-2.firebaseapp.com",
        databaseURL: "https://cwu-gen-2-default-rtdb.firebaseio.com",
        projectId: "cwu-gen-2",
        storageBucket: "cwu-gen-2.appspot.com",
        messagingSenderId: "40585612014",
        appId: "1:40585612014:web:c88141fee369aca68181ff",
        measurementId: "G-S8D7DFJ1G3"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dataRef = database.ref('dataAnggota/');
    const configRef = database.ref('konfigurasi/');

    // Mendapatkan elemen HTML
    const loadingElement = document.getElementById('loading');
    const dataTable = document.getElementById('dataTable');
    const tableBody = dataTable.querySelector('tbody');
    const tglAcaraInput = document.getElementById('tglAcaraInput');
    const setTanggalBtn = document.getElementById('setTanggalBtn');
    const currentTanggalElement = document.getElementById('currentTanggal');
    const filterTanggalSelect = document.getElementById('filterTanggal');
    const totalOverallElement = document.getElementById('totalOverall');
    const selectAllCheckbox = document.getElementById('selectAll');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const exportBtn = document.getElementById('exportBtn');
    const soldItemsForm = document.getElementById('soldItemsForm');
    const soldItemsList = document.getElementById('soldItemsList');
    const individualSellerProfitList = document.getElementById('individualSellerProfit');
    const totalSellerProfitElement = document.getElementById('totalSellerProfit');
    const totalChairProfitElement = document.getElementById('totalChairProfit');
    const toggleFormBtn = document.getElementById('toggleFormBtn');

    // Cache untuk menyimpan data dari Firebase
    let allDataCache = {};
    let soldUnitsByProduct = {}; // Tambahkan cache untuk unit terjual
    let uniqueProducts = {}; // Tambahkan cache untuk produk unik
    let sellerProducts = {}; // Tambahkan cache untuk produk penjual

    // Fungsi untuk memformat tanggal ke format lokal
    function formatDate(date) {
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        return new Date(date).toLocaleDateString('id-ID', options);
    }

    // Fungsi untuk memformat angka ke format Rupiah
    function formatRupiah(number) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    }

    // Fungsi utama untuk merender tabel data
    function renderTable(data, filterDate = '') {
        tableBody.innerHTML = '';
        let isDataFound = false;
        let grandTotal = 0;
        uniqueProducts = {};
        sellerProducts = {};

        // Cek apakah data kosong atau tidak
        if (!data || Object.keys(data).length === 0) {
            loadingElement.textContent = `Belum ada data sama sekali.`;
            loadingElement.style.display = 'block';
            dataTable.style.display = 'none';
            totalOverallElement.style.display = 'none';
            soldItemsForm.style.display = 'none';
            return;
        }

        // Looping melalui setiap anggota
        Object.values(data).forEach(anggota => {
            // Filter berdasarkan tanggal jika ada
            if (filterDate === '' || anggota.tanggal === filterDate) {
                const hasImage = anggota.uploadImageCheck || false;
                
                // Cek apakah anggota punya katalog produk
                if (anggota.katalogProduk && anggota.katalogProduk.length > 0) {
                    if (!sellerProducts[anggota.namaLengkap]) {
                        sellerProducts[anggota.namaLengkap] = {};
                    }

                    anggota.katalogProduk.forEach((produk, produkIndex) => {
                        const totalPerBaris = produk.jumlahUnit * produk.hargaSatuan;
                        grandTotal += totalPerBaris;

                        // Mengumpulkan produk unik untuk form penjualan
                        const productName = produk.namaProduk.toLowerCase();
                        if (!uniqueProducts[productName]) {
                            uniqueProducts[productName] = {
                                namaProduk: produk.namaProduk,
                                totalUnit: 0,
                                hargaSatuan: produk.hargaSatuan,
                            };
                        }
                        uniqueProducts[productName].totalUnit += produk.jumlahUnit;
                        
                        // Menambahkan produk ke data penjual
                        if (!sellerProducts[anggota.namaLengkap][productName]) {
                            sellerProducts[anggota.namaLengkap][productName] = {
                                namaProduk: produk.namaProduk,
                                jumlahUnit: 0,
                                hargaSatuan: produk.hargaSatuan
                            };
                        }
                        sellerProducts[anggota.namaLengkap][productName].jumlahUnit += produk.jumlahUnit;
                        

                        // Membuat baris baru di tabel
                        const newRow = document.createElement('tr');
                        newRow.innerHTML = `
                            <td><input type="checkbox" data-key="${anggota.key}" data-index="${produkIndex}"></td>
                            <td data-label="Nama Lengkap">${anggota.namaLengkap} ${hasImage ? '<i class="fas fa-camera photo-icon"></i>' : ''}</td>
                            <td data-label="Nama Produk">${produk.namaProduk}</td>
                            <td data-label="Jumlah Unit">${produk.jumlahUnit}</td>
                            <td data-label="Harga Satuan">${formatRupiah(produk.hargaSatuan)}</td>
                            <td data-label="Total per Baris"><strong>${formatRupiah(totalPerBaris)}</strong></td>
                        `;
                        tableBody.appendChild(newRow);
                        isDataFound = true;
                    });
                }
            }
        });

        // Menampilkan atau menyembunyikan elemen
        if (isDataFound) {
            loadingElement.style.display = 'none';
            dataTable.style.display = 'table';
            totalOverallElement.innerHTML = `Total Keseluruhan: <strong>${formatRupiah(grandTotal)}</strong>`;
            totalOverallElement.style.display = 'block';
            renderSoldItemsForm(uniqueProducts, sellerProducts);
        } else {
            loadingElement.textContent = `Belum ada data untuk tanggal ini.`;
            loadingElement.style.display = 'block';
            dataTable.style.display = 'none';
            totalOverallElement.style.display = 'none';
            soldItemsForm.style.display = 'none';
        }
    }

    // Fungsi untuk merender form item terjual
    function renderSoldItemsForm(products, sellerData) {
        const productArray = Object.values(products);
        if (productArray.length > 0) {
            soldItemsForm.style.display = 'block';
            soldItemsList.innerHTML = '';
            productArray.forEach(product => {
                const productItem = document.createElement('div');
                productItem.classList.add('sold-item');
                productItem.innerHTML = `
                    <label>${product.namaProduk} (${product.totalUnit} unit):</label>
                    <input type="number" 
                           class="jumlah-terjual" 
                           min="0" 
                           max="${product.totalUnit}" 
                           value="0" 
                           data-harga-satuan="${product.hargaSatuan}"
                           data-product-name="${product.namaProduk.toLowerCase()}">
                `;
                soldItemsList.appendChild(productItem);
            });
            
            // Panggil fungsi calculateProfits setiap kali input berubah
            soldItemsList.querySelectorAll('.jumlah-terjual').forEach(input => {
                input.addEventListener('input', () => calculateProfits(sellerData, products));
            });
            
            // Panggil sekali saat form dirender untuk inisialisasi
            calculateProfits(sellerData, products);
        } else {
            soldItemsForm.style.display = 'none';
        }
    }

    // Fungsi untuk menghitung keuntungan
    function calculateProfits(sellerData, totalProducts) {
        soldUnitsByProduct = {};
        let isValid = true;
        let totalSoldUnits = 0;
        
        soldItemsList.querySelectorAll('.jumlah-terjual').forEach(input => {
            const value = parseInt(input.value) || 0;
            const maxUnits = parseInt(input.getAttribute('max'));
            const productName = input.getAttribute('data-product-name');
            
            if (value > maxUnits) {
                input.classList.add('input-error');
                isValid = false;
            } else {
                input.classList.remove('input-error');
                soldUnitsByProduct[productName] = value;
                totalSoldUnits += value;
            }
        });

        if (isValid) {
            const individualProfits = {};
            let totalSellerProfit = 0;
            
            // Hitung keuntungan untuk setiap penjual
            for (const seller in sellerData) {
                let sellerProfit = 0;
                for (const product in sellerData[seller]) {
                    const productData = sellerData[seller][product];
                    const soldUnits = soldUnitsByProduct[product] || 0;
                    
                    if (soldUnits > 0) {
                        const totalUnitsInStock = totalProducts[product].totalUnit;
                        const share = productData.jumlahUnit / totalUnitsInStock;
                        
                        // Keuntungan penjual dihitung dari harga jual total dari unit yang terjual
                        const sellerShareOfTotalSales = share * soldUnits * productData.hargaSatuan;
                        sellerProfit += sellerShareOfTotalSales;
                    }
                }
                if (sellerProfit > 0) {
                    individualProfits[seller] = sellerProfit;
                    totalSellerProfit += sellerProfit;
                }
            }

            // Tampilkan keuntungan masing-masing penjual
            individualSellerProfitList.innerHTML = '<h4>Keuntungan Tiap Penjual:</h4>';
            for (const seller in individualProfits) {
                const profitItem = document.createElement('li');
                profitItem.textContent = `${seller}: ${formatRupiah(individualProfits[seller])}`;
                individualSellerProfitList.appendChild(profitItem);
            }

            // Hitung dan tampilkan keuntungan ketua
            const chairProfit = totalSoldUnits * 500;
            
            totalSellerProfitElement.innerHTML = `Total Keuntungan Penjual: <strong>${formatRupiah(totalSellerProfit)}</strong>`;
            totalChairProfitElement.innerHTML = `Keuntungan Ketua (Rp 500/unit): <strong>${formatRupiah(chairProfit)}</strong>`;
        } else {
            individualSellerProfitList.innerHTML = '';
            totalSellerProfitElement.textContent = `Terdapat input yang tidak valid!`;
            totalChairProfitElement.textContent = '';
        }
    }

    // Event listener untuk tombol dan select
    setTanggalBtn.addEventListener('click', () => {
        const selectedDate = tglAcaraInput.value;
        if (selectedDate) {
            const formattedDate = formatDate(selectedDate);
            configRef.update({ tanggalAcara: formattedDate })
                .then(() => alert(`Tanggal acara berhasil diatur menjadi ${formattedDate}`))
                .catch((error) => alert('Gagal mengatur tanggal: ' + error.message));
        } else {
            alert('Silakan pilih tanggal terlebih dahulu.');
        }
    });

    toggleFormBtn.addEventListener('click', () => {
        configRef.once('value', (snapshot) => {
            const currentStatus = snapshot.val()?.formStatus || false;
            configRef.update({ formStatus: !currentStatus })
                .then(() => alert(`Formulir berhasil di${!currentStatus ? 'nyalakan' : 'matikan'}.`))
                .catch((error) => alert('Gagal mengubah status formulir: ' + error.message));
        });
    });

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = tableBody.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(checkbox => checkbox.checked = e.target.checked);
    });

    deleteSelectedBtn.addEventListener('click', () => {
        const selectedCheckboxes = tableBody.querySelectorAll('input[type="checkbox"]:checked');
        if (selectedCheckboxes.length === 0) {
            alert('Pilih setidaknya satu data untuk dihapus.');
            return;
        }

        if (confirm(`Apakah Anda yakin ingin menghapus ${selectedCheckboxes.length} data terpilih?`)) {
            const updates = {};
            selectedCheckboxes.forEach(checkbox => {
                const key = checkbox.dataset.key;
                const index = parseInt(checkbox.dataset.index);
                
                if (allDataCache[key]) {
                    const updatedKatalog = [...allDataCache[key].katalogProduk];
                    updatedKatalog.splice(index, 1);
                    
                    if (updatedKatalog.length > 0) {
                        updates[`/dataAnggota/${key}/katalogProduk`] = updatedKatalog;
                    } else {
                        updates[`/dataAnggota/${key}`] = null;
                    }
                }
            });
            
            database.ref().update(updates)
                .then(() => alert('Data berhasil dihapus.'))
                .catch(error => alert('Gagal menghapus data: ' + error.message));
        }
    });

    exportBtn.addEventListener('click', () => {
        // Headers untuk file CSV
        const headers = ["Nama Lengkap", "Nama Produk", "Harga Satuan", "Jumlah Laku", "Keuntungan Penjual", "Keuntungan Ketua"];
        let csv = headers.join(";") + "\n";
        
        const selectedDate = filterTanggalSelect.value;
        
        // Hitung keuntungan setiap penjual
        const individualProfits = {};
        let totalChairProfit = 0;

        for (const seller in sellerProducts) {
            let sellerProfit = 0;
            for (const product in sellerProducts[seller]) {
                const productData = sellerProducts[seller][product];
                const soldUnits = soldUnitsByProduct[product] || 0;
                
                if (soldUnits > 0) {
                    const totalUnitsInStock = uniqueProducts[product].totalUnit;
                    const share = productData.jumlahUnit / totalUnitsInStock;
                    const sellerShareOfTotalSales = share * soldUnits * (productData.hargaSatuan - 500);
                    
                    sellerProfit += sellerShareOfTotalSales;
                    totalChairProfit += soldUnits * 500;
                }
            }
            if (sellerProfit > 0) {
                individualProfits[seller] = sellerProfit;
            }
        }
        
        // Buat baris data untuk CSV
        Object.values(allDataCache).forEach(anggota => {
    if (selectedDate === '' || anggota.tanggal === selectedDate) {
        if (anggota.katalogProduk && anggota.katalogProduk.length > 0) {
            anggota.katalogProduk.forEach(produk => {
                const productNameLower = produk.namaProduk.toLowerCase();
                const soldUnits = soldUnitsByProduct[productNameLower] || 0;

                // kalau tidak ada penjualan, skip
                if (soldUnits === 0) return;
                
                // Hitung keuntungan penjual & ketua
                const sellerProfit = (produk.hargaSatuan - 500) * soldUnits;
                const chairProfit = 500 * soldUnits;

                const row = [
                    `"${anggota.namaLengkap}"`,
                    `"${produk.namaProduk}"`,
                    produk.hargaSatuan,
                    soldUnits,
                    sellerProfit,   // sudah harga - 500
                    chairProfit
                ].join(";");
                csv += row + "\n";
            });
        }
    }
});


        // Tambahkan ringkasan total di akhir file
        csv += "\n\nTotal Keuntungan Penjual;" + Object.values(individualProfits).reduce((sum, val) => sum + val, 0) + ";\n";
        csv += "Total Keuntungan Ketua;" + totalChairProfit + ";\n";
        
        // Buat dan unduh file CSV
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `data_penjualan_${selectedDate || 'semua'}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    filterTanggalSelect.addEventListener('change', () => {
        const selectedDate = filterTanggalSelect.value;
        renderTable(allDataCache, selectedDate);
    });

    // Mengambil data dari Firebase secara real-time
    dataRef.on('value', (snapshot) => {
        const data = snapshot.val();
        
        // Menambahkan properti 'key' ke setiap objek data anggota
        allDataCache = data ? Object.fromEntries(Object.entries(data).map(([key, value]) => [key, { ...value, key }])) : {};
        
        const uniqueDates = new Set();
        if (data) {
            Object.values(data).forEach(item => {
                if (item.tanggal) {
                    uniqueDates.add(item.tanggal);
                }
            });
        }

        // Memperbarui pilihan tanggal di dropdown
        filterTanggalSelect.innerHTML = '<option value="">Semua Tanggal</option>';
        Array.from(uniqueDates).sort().forEach(date => {
            const option = document.createElement('option');
            option.value = date;
            option.textContent = date;
            filterTanggalSelect.appendChild(option);
        });
        
        const selectedDate = filterTanggalSelect.value;
        renderTable(allDataCache, selectedDate);
    }, (error) => {
        console.error("Error membaca data: ", error);
        loadingElement.textContent = "Terjadi kesalahan saat memuat data.";
    });

    // Mendengarkan perubahan konfigurasi (status formulir, tanggal acara)
    configRef.on('value', (snapshot) => {
        const config = snapshot.val();
        currentTanggalElement.textContent = (config && config.tanggalAcara) ? config.tanggalAcara : "Belum diatur";
        if (config && config.formStatus !== undefined) {
            toggleFormBtn.textContent = config.formStatus ? 'Matikan Formulir' : 'Nyalakan Formulir';
            toggleFormBtn.classList.toggle('on', config.formStatus);
            toggleFormBtn.classList.toggle('off', !config.formStatus);
        } else {
            toggleFormBtn.textContent = 'Nyalakan Formulir';
            toggleFormBtn.classList.add('on');
        }
    });
</script>

</body>
</html>
